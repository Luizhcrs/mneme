[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mneme"
version = "0.1.0"
description = "Capability-recall layer for Claude Code. Your AI never forgets what it can do."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Luiz Henrique Cavalcanti Ramos da Silva", email = "luizhcrs@gmail.com" }]
keywords = ["claude-code", "llm", "agent", "memory", "capabilities", "mcp", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.6,<0.2",
    "httpx>=0.27",
    "typer>=0.12",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
]

[project.scripts]
mneme = "mneme.cli:app"

[project.urls]
Homepage = "https://github.com/Luizhcrs/mneme"
Documentation = "https://github.com/Luizhcrs/mneme/tree/main/docs"
Repository = "https://github.com/Luizhcrs/mneme"
Issues = "https://github.com/Luizhcrs/mneme/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mneme"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "sqlite_vec"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --cov=mneme --cov-report=term-missing"

- id: playwright_screenshot
  name: Playwright Screenshot
  category: web_browser
  action_verb: "captures image of a rendered web page"
  triggers: [screenshot, scrape visual, captura site, print site]
  description: |
    MCP Playwright. Renders a page in headless Chromium and returns a PNG.
    Supports SPAs by waiting for selectors before capture.
  params_required: [url]
  params_optional: [selector, viewport, wait_for]
  example: |
    Task: "screenshot the homepage of example.com"
    Call: playwright.screenshot(url="https://example.com", selector="#hero")
  schema_version: "1.45"
  source: mcp

- id: playwright_goto
  name: Playwright Navigate
  category: web_browser
  action_verb: "navigates a headless browser to a URL"
  triggers: [navigate, goto, abrir site, open page]
  description: MCP Playwright page.goto with optional wait conditions.
  params_required: [url]
  params_optional: [wait_until]
  example: 'Call: playwright.goto(url="https://example.com")'
  schema_version: "1.45"
  source: mcp

- id: filesystem_read
  name: Filesystem Read
  category: filesystem
  action_verb: "reads file contents from disk"
  triggers: [read file, le arquivo, open file]
  description: Standard filesystem read with UTF-8 default encoding.
  params_required: [path]
  params_optional: [encoding]
  example: 'Call: filesystem.read(path="/tmp/x.txt")'
  schema_version: "1"
  source: os

- id: telegram_send
  name: Telegram Send Message
  category: comms
  action_verb: "sends a message to a Telegram chat"
  triggers: [telegram, manda mensagem, notifica, alerta]
  description: MCP Telegram plugin. Sends text to a chat_id.
  params_required: [chat_id, text]
  params_optional: [parse_mode]
  example: 'Call: telegram.send(chat_id="503171704", text="deploy ok")'
  schema_version: "1"
  source: mcp

- id: github_create_issue
  name: GitHub Create Issue
  category: vcs
  action_verb: "creates a GitHub issue"
  triggers: [github issue, abre issue, cria issue]
  description: gh CLI wrapper. Requires GH_TOKEN.
  params_required: [repo, title]
  params_optional: [body, labels]
  example: 'Call: gh.issue.create(repo="x/y", title="bug")'
  schema_version: "1"
  source: os

- id: ollama_generate
  name: Ollama Generate
  category: ml_inference
  action_verb: "runs local LLM inference via Ollama"
  triggers: [llm local, gera texto local, ollama]
  description: Local LLM call via Ollama HTTP API.
  params_required: [model, prompt]
  params_optional: [temperature, max_tokens]
  example: 'Call: ollama.generate(model="llama3", prompt="hi")'
  schema_version: "0.5"
  source: os

- id: docker_compose_up
  name: Docker Compose Up
  category: container
  action_verb: "starts services defined in a docker-compose file"
  triggers: [docker compose, sobe servico, deploy local]
  description: Wrapper for `docker compose up -d`.
  params_required: [project_dir]
  params_optional: [services, build]
  example: 'Call: compose.up(project_dir="/path", build=true)'
  schema_version: "1"
  source: os

- id: postgres_query
  name: PostgreSQL Query
  category: db
  action_verb: "executes a SQL query against PostgreSQL"
  triggers: [sql, postgres, banco, query]
  description: Parameterized SQL via psycopg.
  params_required: [dsn, sql]
  params_optional: [params]
  example: 'Call: pg.query(dsn="postgres://...", sql="SELECT 1")'
  schema_version: "16"
  source: os

- id: obsidian_search_vault
  name: Obsidian Vault Search
  category: vault_kb
  action_verb: "searches the Obsidian vault by full text and tags"
  triggers: [obsidian, vault, busca nota, search note]
  description: Searches vault notes by query and tag filter.
  params_required: [query]
  params_optional: [tag, limit]
  example: 'Call: vault.search(query="memory", tag="projeto")'
  schema_version: "1"
  source: project

- id: pyautogui_screenshot
  name: PyAutoGUI Screenshot
  category: desktop_automation
  action_verb: "takes a screenshot of the local desktop"
